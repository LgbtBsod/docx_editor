<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Builder — service & mixin behavior tests</title>
  <script src="ui5-shim.js"></script>
  <script src="../lib/dompurify/purify.min.js"></script>
</head>
<body>
<div id="out"></div>
<script>
(function () {
  "use strict";

  const RESULTS = [];
  function t(name, fn) {
    return Promise.resolve().then(fn).then(
      () => RESULTS.push({ name: name, ok: true }),
      (e) => RESULTS.push({ name: name, ok: false, err: String(e && e.message || e) })
    );
  }
  function assert(cond, msg) { if (!cond) { throw new Error(msg); } }

  // --- JSONModel stub (path-based get/set) -----------------------------
  function ModelStub(oData) {
    this._d = oData || {};
    this.getProperty = (p) => this._d[p.slice(1)];
    this.setProperty = (p, v) => { this._d[p.slice(1)] = v; };
    this.setData = (d) => { this._d = d; };
    this.getData = () => this._d;
  }

  // --- ODataModel/Component stub for service.js ------------------------
  function makeComponentStub(readLog, createLog) {
    const oModel = {
      metadataLoaded: () => Promise.resolve(),
      createKey: (sSet, oKeys) => {
        // faithful v2 escaping: ' doubled, then URI-encoded
        const v = String(oKeys.Key).replace(/'/g, "''");
        return sSet + "('" + encodeURIComponent(v) + "')";
      },
      read: (sPath, mParams) => {
        readLog.push({ path: sPath, params: mParams });
        if (sPath.indexOf("MailContentSet") === 0 || sPath.indexOf("/MailContentSet") === 0) {
          mParams.success({ d: { Key: "k1", Subject: "Subj", Content: "<p>Body</p>" } });
        } else if (sPath.indexOf("/AllowedHostSet") === 0) {
          mParams.success({ results: [{ Host: "company.com" }] });
        } else {
          mParams.success({ results: [] });
        }
      },
      create: (sPath, oData, mParams) => {
        createLog.push({ path: sPath, data: oData });
        mParams.success({ LocalId: oData.LocalId });
      }
    };
    return { getModel: () => oModel };
  }

  // --- Component stub that fails read() iFailCount times with iStatus
  //     before succeeding, for exercising readWithRetry's retry decision ---
  function makeFlakyComponentStub(iStatus, iFailCount) {
    let iAttempts = 0;
    const oModel = {
      metadataLoaded: () => Promise.resolve(),
      read: (sPath, mParams) => {
        iAttempts++;
        if (iAttempts <= iFailCount) {
          mParams.error({ response: { statusCode: iStatus } });
        } else {
          mParams.success({ results: [] });
        }
      }
    };
    return { getModel: () => oModel, getAttempts: () => iAttempts };
  }

  const MODS = [
    ["emailbuilder/util/constants",     "../util/constants.js"],
    ["emailbuilder/util/toast",         "../util/toast.js"],
    ["emailbuilder/util/fileTypes",     "../util/fileTypes.js"],
    ["emailbuilder/util/config",        "../util/config.js"],
    ["emailbuilder/util/libLoader",     "../util/libLoader.js"],
    ["emailbuilder/util/sanitize",      "../util/sanitize.js"],
    ["emailbuilder/util/sourceBlock",   "../util/sourceBlock.js"],
    ["emailbuilder/util/sourceTypes",   "../util/sourceTypes.js"],
    ["emailbuilder/util/draftManager",  "../util/draftManager.js"],
    ["emailbuilder/util/fileProcessor", "../util/fileProcessor.js"],
    ["emailbuilder/model/formatter",    "../model/formatter.js"],
    ["emailbuilder/util/service",       "../util/service.js"],
    ["emailbuilder/controller/SourcesMixin", "../controller/SourcesMixin.js"]
  ];

  let Service, SourcesMixin;

  Promise.all(MODS.map((m) => window.loadAppModule(m[0], m[1])))
  .then(() => {
    Service = sap.ui.require("emailbuilder/util/service");
    SourcesMixin = sap.ui.require("emailbuilder/controller/SourcesMixin");
  })

  // ---------------- service.js ----------------
  .then(() => t("service: copyMailing uses createKey (quote-safe) + fresh LocalId", () => {
    const readLog = [], createLog = [];
    const comp = makeComponentStub(readLog, createLog);
    return Service.copyMailing(comp, "k'; DROP--").then((d) => {
      assert(readLog.length === 1, "expected 1 read");
      const p = readLog[0].path;
      assert(p.indexOf("''") >= 0 || p.indexOf("%27%27") >= 0, "quote not doubled by createKey: " + p);
      assert(p.indexOf("DROP") >= 0, "key lost");
      assert(/^MSG-/.test(d.LocalId), "no fresh LocalId");
      assert(d.Content === "<p>Body</p>", "content not returned");
    });
  }))
  .then(() => t("service: sendMailing deep payload mapping + messageKey contract", () => {
    const readLog = [], createLog = [];
    const comp = makeComponentStub(readLog, createLog);
    const payload = {
      LocalId: "MSG-1", Subject: "S", Content: "<p>x</p>",
      ToRecipients: [{ id: "r1", email: "a@b.com", name: "N", role: "R" }],
      Attachments: [{ id: "x", name: "f.pdf", mimeType: "application/pdf", base64: "QUJD" }]
    };
    return Service.sendMailing(comp, payload, false).then((res) => {
      assert(createLog.length === 1, "expected 1 create");
      const d = createLog[0].data;
      assert(d.ToRecipients[0].RecipientId === "r1" && d.ToRecipients[0].Email === "a@b.com", "recipient mapping");
      assert(d.ToTexts.length === 1 && d.ToTexts[0].Content === "<p>x</p>", "text mapping");
      assert(d.ToAttachments[0].ContentBase64 === "QUJD", "attachment mapping");
      assert(d.Status === "020", "status");
      assert(d.CreatedBy === undefined, "CreatedBy must NOT be set by client (server uses sy-uname)");
      assert(res.messageKey === "MSG_SENT" && res.localId === "MSG-1", "messageKey contract");
    });
  }))
  .then(() => t("service: test send has empty recipients + MSG_TEST_SENT", () => {
    const readLog = [], createLog = [];
    const comp = makeComponentStub(readLog, createLog);
    return Service.sendMailing(comp, { LocalId: "L", Subject: "s", Content: "c", ToRecipients: [] }, true)
      .then((res) => {
        assert(createLog[0].data.Status === "010", "test status");
        assert(res.messageKey === "MSG_TEST_SENT", "test messageKey");
      });
  }))
  .then(() => t("service: collection reads carry $top cap", () => {
    const readLog = [], createLog = [];
    const comp = makeComponentStub(readLog, createLog);
    return Service.getAllowedHosts(comp).then(() => {
      const p = readLog[0].params;
      assert(p.urlParameters && p.urlParameters.$top === "100", "$top missing: " + JSON.stringify(p.urlParameters));
    });
  }))
  .then(() => t("service: readWithRetry does not retry a 4xx (client error)", () => {
    const stub = makeFlakyComponentStub(400, 999); // always fails
    return Service.getAllowedHosts(stub).then(
      () => { throw new Error("expected rejection on persistent 4xx"); },
      () => {
        assert(stub.getAttempts() === 1, "expected exactly 1 attempt for a 4xx, got " + stub.getAttempts());
      }
    );
  }))
  .then(() => t("service: readWithRetry retries a 5xx and recovers", () => {
    const stub = makeFlakyComponentStub(503, 1); // fails once, then succeeds
    return Service.getAllowedHosts(stub).then((aHosts) => {
      assert(stub.getAttempts() === 2, "expected 2 attempts (1 fail + 1 retry), got " + stub.getAttempts());
      assert(Array.isArray(aHosts), "expected array result after recovery");
    });
  }))
  .then(() => t("service: getMailingStatus filters by MailingId", () => {
    const readLog = [], createLog = [];
    const comp = makeComponentStub(readLog, createLog);
    return Service.getMailingStatus(comp, "m1").then(() => {
      const f = readLog[0].params.filters;
      assert(f && f.length === 1 && f[0].sPath === "MailingId" && f[0].oValue1 === "m1", "filter wrong");
    });
  }))

  // ---------------- SourcesMixin behavior ----------------
  .then(() => t("W-9 fix: onClearAllNews removes blocks from editor AND newsItems list", () => {
    // newsItems and sources are separate state arrays (SourcesMixin.js:
    // _addSourceToList always tags type "file"; news goes through
    // _addNewsAsSource into /newsItems) — onClearAllNews must only touch
    // /newsItems and leave /sources untouched.
    const removed = [];
    const ctx = Object.assign({}, SourcesMixin, {
      _oState: new ModelStub({
        newsItems: [{ id: "n1" }, { id: "n2" }],
        sources: [{ id: "f1", type: "file", ext: ".txt" }]
      }),
      _oEditor: { removeSource: (id) => removed.push(id) },
      _t: (k) => k,
      _updateHeaderBadges: function () { this._badges = true; }
    });
    ctx.onClearAllNews();
    assert(removed.join(",") === "n1,n2", "editor blocks not removed: " + removed);
    assert(ctx._oState.getProperty("/newsItems").length === 0, "newsItems not cleared");
    const aSources = ctx._oState.getProperty("/sources");
    assert(aSources.length === 1 && aSources[0].id === "f1", "unrelated sources list touched");
    assert(ctx._badges, "badges not refreshed");
  }))
  .then(() => t("F-7 fix: duplicate-named attachments delete only one", () => {
    const ctx = Object.assign({}, SourcesMixin, {
      _oState: new ModelStub({
        attachments: [{ id: "a1", name: "same.pdf" }, { id: "a2", name: "same.pdf" }]
      }),
      _t: (k) => k,
      _updateHeaderBadges: () => {}
    });
    ctx.onAttachmentDeleted({
      getSource: () => ({ getBindingContext: () => ({ getProperty: () => "a1" }) })
    });
    const a = ctx._oState.getProperty("/attachments");
    assert(a.length === 1 && a[0].id === "a2", "duplicate-name delete broken: " + JSON.stringify(a));
  }))
  .then(() => t("onAttachmentChange: size limit + id assignment + count cap", () => {
    const toasts = [];
    const bigBytes = new Uint8Array(6 * 1024 * 1024);
    const ctx = Object.assign({}, SourcesMixin, {
      _oState: new ModelStub({ attachments: [] }),
      _t: (k) => { toasts.push(k); return k; },
      _updateHeaderBadges: () => {}
    });
    const fBig = new File([bigBytes], "big.bin", { type: "application/octet-stream" });
    const fOk = new File(["hello"], "ok.txt", { type: "text/plain" });
    ctx.onAttachmentChange({ getParameter: () => [fBig, fOk] });
    return new Promise((res) => setTimeout(res, 300)).then(() => {
      const a = ctx._oState.getProperty("/attachments");
      assert(a.length === 1 && a[0].name === "ok.txt", "size limit failed: " + JSON.stringify(a.map(x=>x.name)));
      assert(a[0].id && a[0].base64 === btoa("hello"), "id/base64 missing");
      assert(toasts.indexOf("MSG_ATTACHMENT_TOO_LARGE") >= 0, "no size toast");
    });
  }))
  .then(() => t("_addSourceToList: copy-on-write (new array reference)", () => {
    const ctx = Object.assign({}, SourcesMixin, {
      _oState: new ModelStub({ sources: [] }),
      _t: (k) => k,
      _updateHeaderBadges: () => {}
    });
    const before = ctx._oState.getProperty("/sources");
    ctx._addSourceToList("s1", "file", "a.txt");
    const after = ctx._oState.getProperty("/sources");
    assert(before !== after, "array mutated in place");
    assert(after.length === 1 && after[0].iconSrc, "source entry incomplete");
  }))
  .then(() => t("PDF mode prompt: onPdfModeConfirm resolves with the tab the user picked", () => {
    // _promptPdfMode reuses an already-loaded dialog (Fragment.load is
    // stubbed to always reject in this shim, so the dialog is pre-seeded
    // here to exercise the reuse branch, same as a real second PDF drop).
    const ctx = Object.assign({}, SourcesMixin, {
      _oState: new ModelStub({ pdfModeIndex: 0 }),
      _oPdfModeDialog: { open: () => {}, close: () => {} },
      _t: (k) => k, _updateHeaderBadges: () => {}
    });
    const pPrompt = ctx._promptPdfMode("a.pdf");
    ctx._oState.setProperty("/pdfModeIndex", 1); // user selects the "Images" tab
    ctx.onPdfModeConfirm();
    return pPrompt.then((sMode) => {
      assert(sMode === "images", "expected images mode for tab index 1, got " + sMode);
    });
  }))
  .then(() => t("PDF mode prompt: a second concurrent prompt auto-resolves the first as text", () => {
    const ctx = Object.assign({}, SourcesMixin, {
      _oState: new ModelStub({ pdfModeIndex: 0 }),
      _oPdfModeDialog: { open: () => {}, close: () => {} },
      _t: (k) => k, _updateHeaderBadges: () => {}
    });
    const pFirst = ctx._promptPdfMode("a.pdf");
    const pSecond = ctx._promptPdfMode("b.pdf");
    ctx.onPdfModeConfirm();
    return Promise.all([pFirst, pSecond]).then(([sFirst, sSecond]) => {
      assert(sFirst === "text", "superseded prompt should auto-resolve as text, got " + sFirst);
      assert(sSecond === "text", "live prompt should resolve from confirm (default tab), got " + sSecond);
    });
  }))
  .then(() => {
    window.__testResults = RESULTS;
    document.getElementById("out").textContent = JSON.stringify(RESULTS, null, 1);
  })
  .catch((e) => {
    RESULTS.push({ name: "HARNESS", ok: false, err: String(e && e.message || e) });
    window.__testResults = RESULTS;
  });
})();
</script>
</body>
</html>

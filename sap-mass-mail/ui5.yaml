specVersion: "3.0"
metadata:
  name: emailbuilder
type: application
resources:
  configuration:
    paths:
      webapp: .
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      # Node/build tooling and its own output — never app resources.
      - "/node_modules/**"
      - "/dist/**"
      - "/package.json"
      - "/package-lock.json"
      - "/ui5.yaml"
      - "/server.js"
      # Custom browser test harness (test/modules.html, behavior.html) —
      # dev-only, not shipped to a Fiori Launchpad/BSP target.
      - "/test/**"
      # ABAP backend sources — imported into the ABAP system separately,
      # never served as a UI5 app resource.
      - "/abap/**"
      - "/.gitignore"
      # Editor/session and local dev-mode artifacts that happen to live
      # under the app root instead of a dedicated webapp/ folder.
      - "/.claude/**"
      - "/saved_emails/**"
      - "/*.docx"
      - "/*.pdf"
      - "/*.htm"
      - "/*.files/**"
